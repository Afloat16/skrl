name: Validate distributed SAC entropy

on:
  push:
    branches:
      - validation/sac-distributed-entropy-20261116

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -e . numpy==1.26.4 pytest==8.3.5 hypothesis==6.130.4 black==24.8.0 isort==5.13.2
      - name: Verify unchanged production baseline
        run: |
          git show c0ad68a1e3feb4d288570db87403648074cabdb7:skrl/agents/torch/sac/sac.py > skrl/agents/torch/sac/sac.py
          git show c0ad68a1e3feb4d288570db87403648074cabdb7:skrl/agents/torch/sac/sac_rnn.py > skrl/agents/torch/sac/sac_rnn.py
          set +e
          python -m pytest tests/utils/distributed/torch/test_sac_entropy.py -q --tb=short --junitxml=baseline.xml > baseline.log 2>&1
          result=$?
          set -e
          git restore --source=HEAD --worktree -- skrl/agents/torch/sac/sac.py skrl/agents/torch/sac/sac_rnn.py
          cat baseline.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("baseline.xml").getroot().find("testsuite")
          assert suite.get("tests") == "4", suite.attrib
          assert suite.get("failures") == "2", suite.attrib
          assert suite.get("errors") == "0", suite.attrib
          assert suite.get("skipped") == "0", suite.attrib
          for failure in suite.iter("failure"):
              assert "Tensor-likes are not close" in failure.text, failure.text
          PY
      - name: Validate fixed updates and original SAC coverage
        if: always()
        run: |
          python -m pytest tests/utils/distributed/torch/test_sac_entropy.py tests/utils/distributed/torch/test_gradient_reduction.py tests/agents/torch/test_sac.py -q --tb=short --hypothesis-seed=0 --junitxml=fixed.xml > fixed.log 2>&1
          cat fixed.log
          python -m black --check skrl/agents/torch/sac/sac.py skrl/agents/torch/sac/sac_rnn.py tests/utils/distributed/torch/test_sac_entropy.py
          python -m isort --check-only skrl/agents/torch/sac/sac.py skrl/agents/torch/sac/sac_rnn.py tests/utils/distributed/torch/test_sac_entropy.py
          git diff --check
      - name: Save exact validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-sac-entropy-validation
          path: |
            baseline.log
            baseline.xml
            fixed.log
            fixed.xml
          retention-days: 7
