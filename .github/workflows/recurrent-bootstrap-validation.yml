name: Recurrent time-limit bootstrap validation

on:
  push:
    branches:
      - validation/recurrent-time-limit-bootstrap-20261115

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: c0ad68a1e3feb4d288570db87403648074cabdb7
      CANDIDATE_SHA: ab4680debbfc104c19544d030e1cd201f776a390
      PYTHONPATH: .
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Create CPU environment
        timeout-minutes: 10
        run: |
          uv venv --python 3.12
          uv pip install -e '.[tests]' numpy==1.26.4 gymnasium==1.1.1
          uv pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip freeze
          uv run --no-sync python --version
      - name: Confirm source and test blobs
        run: git diff --exit-code "$CANDIDATE_SHA" HEAD -- skrl tests
      - name: Confirm unchanged source fails the recurrent regressions
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          base = os.environ["BASE_SHA"]
          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD", "--", "skrl"], text=True).splitlines()
          for path in changed:
              Path(path).write_bytes(subprocess.check_output(["git", "show", f"{base}:{path}"]))
          try:
              subprocess.run(["python", ".github/validation/recurrent_bootstrap_probe.py"], check=True)
              result = subprocess.run([
                  "python", "-m", "pytest", "tests/agents/torch/test_recurrent_time_limit_bootstrap.py",
                  "-q", "--junitxml=/tmp/baseline.xml",
              ])
              root = ET.parse("/tmp/baseline.xml").getroot()
              suites = list(root.iter("testsuite"))
              errors = sum(int(s.get("errors", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              assert result.returncode == 1 and errors == 0 and failures == 33, (
                  result.returncode, errors, failures
              )
              print(f"BASELINE_CONFIRMED failures={failures} errors={errors}", flush=True)
          finally:
              subprocess.run(["git", "checkout", "--", *changed], check=True)
          PY
      - name: Verify corrected returns and public API regressions
        run: |
          uv run --no-sync python .github/validation/recurrent_bootstrap_probe.py
          uv run --no-sync python -m pytest tests/agents/torch/test_recurrent_time_limit_bootstrap.py -q
      - name: Run complete CPU agent suites
        run: uv run --no-sync python -m pytest tests/agents/torch tests/multi_agents/torch -q -k 'not cuda'
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: c0ad68a1e3feb4d288570db87403648074cabdb7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install pre-commit
      - name: Run repository contribution hooks
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- skrl tests | xargs uv run --no-sync pre-commit run --show-diff-on-failure --files
